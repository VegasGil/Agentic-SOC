title: PowerShell Ofuscado (MITRE ATT&CK)
id: 2b3c4d5e-6f7a-8b9c-0d1e-2f3a4b5c6d7e
status: experimental
description: Detecta PowerShell con flags de ofuscacion.
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        CommandLine|contains:
            - '-enc'
            - '-encodedcommand'
            - '-w hidden'
            - '-nop'
    condition: selection
level: critical

