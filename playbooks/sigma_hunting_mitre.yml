title: Creacion de Servicio Sospechoso
id: 3c4d5e6f-7a8b-9c0d-1e2f-3a4b5c6d7e8f
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        CommandLine|contains:
            - 'sc create'
            - 'New-Service'
    condition: selection
level: high